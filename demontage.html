<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Demontage, Bohrarbeiten & Küchen-Umzug | Raphael Lezius Premium Service</title>

    <meta name="description" content="Ihr Experte für zerstörungsfreie Möbel-Demontage, professionelle Bohrarbeiten, Lampenmontage und den Komplett-Umzug von Gebrauchtküchen in Augsburg und München.">
    <meta name="theme-color" content="#030405">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* ============================================================
           ROOT TOKENS — HIGH-END 2026 DEMONTAGE
           ============================================================ */
        :root {
            --demo-green: #39ff14;
            --demo-green-dim: rgba(57, 255, 20, 0.08);
            --demo-green-glow: rgba(57, 255, 20, 0.20);
            --demo-cyan: #00e5ff;
            --demo-cyan-dim: rgba(0, 229, 255, 0.06);
            --neon-gold: #ffd700;
            --neon-gold-dim: rgba(255, 215, 0, 0.06);
            --bg-primary: #030405;
            --bg-surface: #080b0e;
            --bg-card: rgba(255, 255, 255, 0.025);
            --text-primary: #f8fafc;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
            --border-subtle: rgba(255, 255, 255, 0.06);
            --border-glow: rgba(57, 255, 20, 0.12);
            --glass-bg: rgba(3, 4, 5, 0.78);
            --glass-border: rgba(57, 255, 20, 0.06);
            --font-head: 'Space Grotesk', system-ui, sans-serif;
            --font-body: 'Inter', system-ui, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --font-signature: 'Mrs Saint Delafield', cursive;
            --radius-lg: 20px;
            --radius-md: 14px;
            --radius-sm: 10px;
            --shadow-soft: 0 20px 60px rgba(0, 0, 0, 0.6);
            --shadow-glow: 0 0 60px rgba(57, 255, 20, 0.06);
            --transition-smooth: 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --transition-bounce: 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            --ease-out-expo: cubic-bezier(0.19, 1, 0.22, 1);
            --nav-height: 68px;
            --container: 1260px;
        }

        /* ============================================================
           RESET & BASE
           ============================================================ */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-body);
            overflow-x: hidden;
            line-height: 1.6;
            padding-top: 0;
        }
        body.menu-open {
            overflow: hidden;
        }
        ::selection {
            background: var(--demo-green);
            color: #000;
        }
        img,
        video {
            max-width: 100%;
            display: block;
        }
        a {
            text-decoration: none;
            color: inherit;
        }
        button {
            cursor: pointer;
            border: none;
            background: none;
            font-family: inherit;
            color: inherit;
        }
        ul {
            list-style: none;
        }

        .container {
            max-width: var(--container);
            margin: 0 auto;
            padding: 0 clamp(16px, 4vw, 32px);
        }
        .relative-z {
            position: relative;
            z-index: 2;
        }
        .center {
            text-align: center;
        }
        .green-text {
            color: var(--demo-green);
        }
        .cyan-text {
            color: var(--demo-cyan);
        }
        .gold-text {
            color: var(--neon-gold);
        }
        .text-muted {
            color: var(--text-muted);
        }
        .text-dim {
            color: var(--text-dim);
        }

        .section-padding {
            padding: clamp(60px, 8vw, 110px) 0;
        }
        .bg-darker {
            background: #05070a;
        }
        .bg-surface {
            background: var(--bg-surface);
        }
        .bg-dark {
            background: #020203;
        }

        /* ============================================================
           GLASS PANEL
           ============================================================ */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            padding: 28px;
            transition: border-color 0.3s, transform 0.3s var(--transition-bounce), box-shadow 0.3s;
        }
        .glass-panel:hover {
            border-color: rgba(57, 255, 20, 0.12);
            box-shadow: var(--shadow-glow);
        }

        /* ============================================================
           SECTION TAG
           ============================================================ */
        .section-tag {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-family: var(--font-mono);
            font-size: 0.62rem;
            letter-spacing: 2.8px;
            text-transform: uppercase;
            color: var(--demo-green);
            background: var(--demo-green-dim);
            padding: 6px 18px;
            border-radius: 30px;
            border: 1px solid rgba(57, 255, 20, 0.12);
        }
        .section-tag i {
            font-size: 0.55rem;
        }
        .section-tag.cyan-tag {
            color: var(--demo-cyan);
            background: var(--demo-cyan-dim);
            border-color: rgba(0, 229, 255, 0.12);
        }
        .section-tag.gold-tag {
            color: var(--neon-gold);
            background: var(--neon-gold-dim);
            border-color: rgba(255, 215, 0, 0.10);
        }
        .blink {
            animation: blinkPulse 1.8s ease-in-out infinite;
        }
        @keyframes blinkPulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.25;
            }
        }

        /* ============================================================
           SECTION HEADER
           ============================================================ */
        .section-header {
            text-align: center;
            margin-bottom: 50px;
        }
        .section-header .pre-title {
            font-family: var(--font-mono);
            font-size: 0.6rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--demo-green);
            margin-bottom: 12px;
            display: block;
        }
        .section-header .pre-title.cyan-pre {
            color: var(--demo-cyan);
        }
        .section-header h2 {
            font-family: var(--font-head);
            font-weight: 800;
            font-size: clamp(2rem, 4.2vw, 3.2rem);
            line-height: 1.1;
            margin-bottom: 14px;
            color: #fff;
        }
        .section-header h2 .highlight {
            background: linear-gradient(135deg, var(--demo-green), var(--demo-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .section-header p {
            color: var(--text-muted);
            max-width: 620px;
            margin: 0 auto;
            font-size: 1.05rem;
            line-height: 1.7;
        }

        /* ============================================================
           CUSTOM CURSOR
           ============================================================ */
        .cursor-dot,
        .cursor-ring {
            position: fixed;
            top: 0;
            left: 0;
            border-radius: 50%;
            pointer-events: none;
            z-index: 99999;
            transform: translate(-50%, -50%);
        }
        .cursor-dot {
            width: 8px;
            height: 8px;
            background: var(--demo-green);
            mix-blend-mode: difference;
            transition: width 0.2s, height 0.2s;
        }
        .cursor-ring {
            width: 38px;
            height: 38px;
            border: 1.5px solid rgba(57, 255, 20, 0.45);
            transition: width 0.35s, height 0.35s, border-color 0.35s;
            z-index: 99998;
        }
        .cursor-dot.hovering {
            width: 16px;
            height: 16px;
            background: #fff;
            mix-blend-mode: normal;
        }
        .cursor-ring.hovering {
            width: 56px;
            height: 56px;
            border-color: var(--demo-green);
            border-width: 2px;
            box-shadow: 0 0 30px rgba(57, 255, 20, 0.12);
        }
        @media (max-width: 768px) {
            .cursor-dot,
            .cursor-ring {
                display: none;
            }
        }

        /* ============================================================
           SCROLL PROGRESS
           ============================================================ */
        .scroll-progress {
            position: fixed;
            top: 0;
            left: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--demo-green), var(--demo-cyan));
            z-index: 100000;
            width: 0%;
            box-shadow: 0 0 16px rgba(57, 255, 20, 0.30);
        }

        /* ============================================================
           BUTTONS
           ============================================================ */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 16px 34px;
            border-radius: var(--radius-sm);
            font-family: var(--font-mono);
            font-weight: 700;
            font-size: 0.72rem;
            letter-spacing: 1.6px;
            text-transform: uppercase;
            transition: all 0.35s var(--ease-out-expo);
            border: 1px solid transparent;
            position: relative;
            overflow: hidden;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--demo-green), #1a9e0a);
            color: #000;
            box-shadow: 0 12px 40px rgba(57, 255, 20, 0.25);
        }
        .btn-primary:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 20px 56px rgba(57, 255, 20, 0.40);
            filter: brightness(1.08);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
        }
        .btn-secondary:hover {
            background: rgba(57, 255, 20, 0.06);
            border-color: var(--demo-green);
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(57, 255, 20, 0.06);
        }
        .btn-ghost-green {
            background: transparent;
            border-color: rgba(57, 255, 20, 0.25);
            color: var(--demo-green);
        }
        .btn-ghost-green:hover {
            background: var(--demo-green-dim);
            border-color: var(--demo-green);
            transform: translateY(-4px);
            box-shadow: 0 0 40px rgba(57, 255, 20, 0.08);
        }
        .btn-cyan {
            background: rgba(0, 229, 255, 0.06);
            border-color: rgba(0, 229, 255, 0.15);
            color: var(--demo-cyan);
        }
        .btn-cyan:hover {
            background: rgba(0, 229, 255, 0.12);
            border-color: var(--demo-cyan);
            transform: translateY(-4px);
            box-shadow: 0 0 40px rgba(0, 229, 255, 0.08);
        }
        .btn-gold {
            background: rgba(255, 215, 0, 0.05);
            border-color: rgba(255, 215, 0, 0.12);
            color: var(--neon-gold);
        }
        .btn-gold:hover {
            background: rgba(255, 215, 0, 0.10);
            border-color: var(--neon-gold);
            transform: translateY(-4px);
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.06);
        }

        /* ============================================================
           NAVIGATION
           ============================================================ */
        .site-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 0 20px;
            height: var(--nav-height);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(3, 4, 5, 0.72);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            transition: background 0.4s, border-color 0.4s;
        }
        .site-nav.scrolled {
            background: rgba(3, 4, 5, 0.88);
            border-bottom: 1px solid rgba(57, 255, 20, 0.06);
        }
        .nav-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: var(--font-head);
            font-weight: 800;
            font-size: 1.1rem;
            color: #fff;
        }
        .nav-logo .mark {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            background: linear-gradient(135deg, var(--demo-green), var(--demo-cyan));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            color: #000;
        }
        .nav-logo span {
            color: var(--demo-green);
        }
        .nav-links {
            display: flex;
            gap: 28px;
            align-items: center;
        }
        .nav-links a {
            font-family: var(--font-mono);
            font-size: 0.62rem;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: var(--text-muted);
            transition: color 0.3s;
            position: relative;
        }
        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--demo-green);
            transition: width 0.3s var(--ease-out-expo);
        }
        .nav-links a:hover {
            color: #fff;
        }
        .nav-links a:hover::after {
            width: 100%;
        }
        .nav-links a.active {
            color: #fff;
        }
        .nav-links a.active::after {
            width: 100%;
        }
        .nav-cta {
            padding: 8px 18px;
            border-radius: 30px;
            background: linear-gradient(135deg, var(--demo-green), #1a9e0a);
            color: #000 !important;
            font-size: 0.55rem !important;
            letter-spacing: 1.4px !important;
            border: none !important;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .nav-cta::after {
            display: none !important;
        }
        .nav-cta:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 8px 30px rgba(57, 255, 20, 0.20);
            color: #000 !important;
        }
        .nav-toggle {
            display: none;
            flex-direction: column;
            gap: 5px;
            padding: 6px;
            background: none;
            border: none;
            cursor: pointer;
        }
        .nav-toggle span {
            width: 26px;
            height: 2px;
            background: #fff;
            border-radius: 2px;
            transition: 0.3s;
        }
        .nav-toggle.active span:nth-child(1) {
            transform: rotate(45deg) translate(5px, 5px);
        }
        .nav-toggle.active span:nth-child(2) {
            opacity: 0;
        }
        .nav-toggle.active span:nth-child(3) {
            transform: rotate(-45deg) translate(5px, -5px);
        }

        .mobile-menu {
            position: fixed;
            top: var(--nav-height);
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(3, 4, 5, 0.96);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 32px;
            transform: translateX(100%);
            transition: transform 0.5s var(--ease-out-expo);
            z-index: 999;
            padding: 40px 20px;
        }
        .mobile-menu.open {
            transform: translateX(0);
        }
        .mobile-menu a {
            font-family: var(--font-head);
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-muted);
            transition: color 0.3s;
        }
        .mobile-menu a:hover {
            color: #fff;
        }
        .mobile-menu .mobile-cta {
            margin-top: 20px;
            padding: 14px 40px;
            border-radius: 30px;
            background: linear-gradient(135deg, var(--demo-green), #1a9e0a);
            color: #000 !important;
            font-family: var(--font-mono);
            font-size: 0.7rem;
            letter-spacing: 1.6px;
            text-transform: uppercase;
        }

        @media (max-width: 900px) {
            .nav-links {
                display: none;
            }
            .nav-toggle {
                display: flex;
            }
            .mobile-menu {
                transform: translateX(100%);
            }
            .mobile-menu.open {
                transform: translateX(0);
            }
        }

        /* ============================================================
           HERO
           ============================================================ */
        .demo-hero {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: clamp(100px, 12vw, 140px) 0 clamp(40px, 5vw, 60px);
            overflow: hidden;
        }
        .video-bg-container {
            position: absolute;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }
        .hero-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.30;
            filter: saturate(0.4) contrast(1.1) brightness(0.4);
        }
        .hero-vignette {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse at 30% 30%, rgba(57, 255, 20, 0.04), transparent 60%),
                radial-gradient(ellipse at 70% 80%, rgba(0, 229, 255, 0.03), transparent 50%),
                linear-gradient(180deg, rgba(3, 4, 5, 0.3) 0%, rgba(3, 4, 5, 0.85) 100%);
            pointer-events: none;
            z-index: 1;
        }
        .hero-grid-overlay {
            position: absolute;
            inset: 0;
            z-index: 1;
            background-image:
                linear-gradient(rgba(57, 255, 20, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(57, 255, 20, 0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.3;
            pointer-events: none;
        }

        .demo-hero .container {
            position: relative;
            z-index: 2;
        }

        .hero-content {
            max-width: 780px;
            margin: 0 auto;
            text-align: center;
        }

        .hero-content .badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(57, 255, 20, 0.06);
            border: 1px solid rgba(57, 255, 20, 0.12);
            padding: 6px 18px;
            border-radius: 100px;
            font-family: var(--font-mono);
            font-size: 0.55rem;
            letter-spacing: 2px;
            color: var(--demo-green);
            margin-bottom: 24px;
        }
        .hero-content .badge .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--demo-green);
            animation: pulseDot 2s infinite;
        }
        @keyframes pulseDot {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.25;
            }
        }

        .hero-content h1 {
            font-family: var(--font-head);
            font-weight: 900;
            font-size: clamp(2.4rem, 6vw, 4.4rem);
            line-height: 1.05;
            letter-spacing: -1.5px;
            color: #fff;
            margin-bottom: 20px;
        }
        .hero-content h1 .green {
            color: var(--demo-green);
            text-shadow: 0 0 40px rgba(57, 255, 20, 0.15);
        }
        .hero-content .sub-headline {
            font-size: clamp(0.95rem, 1.2vw, 1.15rem);
            color: var(--text-muted);
            line-height: 1.8;
            max-width: 620px;
            margin: 0 auto 16px;
        }
        .hero-content .sub-headline strong {
            color: #e2e8f0;
            font-weight: 600;
        }
        .hero-content .trust-micro {
            display: flex;
            justify-content: center;
            gap: 28px;
            flex-wrap: wrap;
            margin: 18px 0 32px;
            font-family: var(--font-mono);
            font-size: 0.55rem;
            letter-spacing: 1.2px;
            color: var(--text-dim);
        }
        .hero-content .trust-micro span {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .hero-content .trust-micro i {
            color: var(--demo-green);
            font-size: 0.7rem;
        }
        .hero-content .btns {
            display: flex;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .scroll-indicator {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin-top: 50px;
            color: var(--text-dim);
            font-family: var(--font-mono);
            font-size: 0.55rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            animation: floatDown 2.4s ease-in-out infinite;
        }
        .scroll-indicator i {
            font-size: 1.1rem;
            color: var(--demo-green);
        }
        @keyframes floatDown {
            0%,
            100% {
                transform: translateY(0);
                opacity: 0.5;
            }
            50% {
                transform: translateY(8px);
                opacity: 1;
            }
        }

        /* ============================================================
           MARQUEE
           ============================================================ */
        .demo-marquee-wrapper {
            background: var(--bg-surface);
            border-top: 1px solid var(--border-subtle);
            border-bottom: 1px solid var(--border-subtle);
            padding: 14px 0;
            overflow: hidden;
            position: relative;
            z-index: 1;
        }
        .demo-marquee-track {
            display: flex;
            gap: 48px;
            white-space: nowrap;
            animation: marqueeScroll 30s linear infinite;
            width: max-content;
        }
        .demo-marquee-track span {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-family: var(--font-mono);
            font-size: 0.68rem;
            letter-spacing: 1.8px;
            text-transform: uppercase;
            color: var(--text-muted);
        }
        .demo-marquee-track span i {
            color: var(--demo-green);
            font-size: 0.6rem;
        }
        @keyframes marqueeScroll {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(-50%);
            }
        }
        @media (prefers-reduced-motion: reduce) {
            .demo-marquee-track {
                animation: none;
                flex-wrap: wrap;
                justify-content: center;
                gap: 20px;
            }
        }

        /* ============================================================
           TRUST BAR
           ============================================================ */
        .trust-bar-section {
            background: var(--bg-primary);
            padding: 20px 0;
            border-bottom: 1px solid var(--border-subtle);
        }
        .trust-bar-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 28px 48px;
        }
        .trust-bar-grid .item {
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: var(--font-mono);
            font-size: 0.62rem;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: var(--text-muted);
        }
        .trust-bar-grid .item i {
            font-size: 1.1rem;
            color: var(--demo-green);
        }

        /* ============================================================
           STATS COUNTER
           ============================================================ */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
        }
        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
        .stat-card {
            text-align: center;
            padding: 28px 16px;
            border-radius: var(--radius-md);
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            transition: transform 0.4s var(--transition-bounce), border-color 0.4s, box-shadow 0.4s;
        }
        .stat-card:hover {
            transform: translateY(-6px);
            border-color: rgba(57, 255, 20, 0.15);
            box-shadow: var(--shadow-glow);
        }
        .stat-card .number {
            font-family: var(--font-head);
            font-size: clamp(2.2rem, 4vw, 3.6rem);
            font-weight: 900;
            background: linear-gradient(135deg, var(--demo-green), var(--demo-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
        }
        .stat-card .label {
            display: block;
            margin-top: 6px;
            font-family: var(--font-mono);
            font-size: 0.6rem;
            letter-spacing: 1.4px;
            text-transform: uppercase;
            color: var(--text-dim);
        }

        /* ============================================================
           PROBLEM / SOLUTION
           ============================================================ */
        .problem-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 10px;
        }
        @media (max-width: 900px) {
            .problem-grid {
                grid-template-columns: 1fr;
                max-width: 500px;
                margin-left: auto;
                margin-right: auto;
            }
        }
        .problem-card {
            padding: 28px 24px;
            border-radius: var(--radius-md);
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            transition: all 0.4s var(--transition-bounce);
            position: relative;
            overflow: hidden;
        }
        .problem-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--demo-green), var(--demo-cyan));
            opacity: 0;
            transition: opacity 0.4s;
        }
        .problem-card:hover::before {
            opacity: 1;
        }
        .problem-card:hover {
            transform: translateY(-6px);
            border-color: rgba(57, 255, 20, 0.10);
            box-shadow: var(--shadow-glow);
        }
        .problem-card .icon-wrap {
            font-size: 2rem;
            margin-bottom: 14px;
            display: block;
            color: var(--demo-green);
        }
        .problem-card h3 {
            font-family: var(--font-head);
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: #fff;
        }
        .problem-card .problem-text {
            color: var(--text-muted);
            font-size: 0.85rem;
            line-height: 1.6;
            margin-bottom: 12px;
        }
        .problem-card .solution-text {
            color: var(--text-primary);
            font-size: 0.9rem;
            font-weight: 500;
            padding: 12px 16px;
            background: rgba(57, 255, 20, 0.03);
            border-radius: 8px;
            border-left: 2px solid var(--demo-green);
        }
        .problem-card .solution-text i {
            color: var(--demo-green);
            margin-right: 8px;
        }

        /* ============================================================
           BENTO GRID — SERVICES
           ============================================================ */
        .bento-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 18px;
        }
        .bento-item {
            grid-column: span 12;
            padding: clamp(28px, 3.5vw, 44px);
            border-radius: var(--radius-lg);
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            transition: border-color 0.4s, transform 0.4s var(--transition-bounce), box-shadow 0.4s;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        .bento-item:hover {
            border-color: rgba(57, 255, 20, 0.10);
            transform: translateY(-6px);
            box-shadow: var(--shadow-glow);
        }
        .bento-item .icon-big {
            font-size: 2.4rem;
            margin-bottom: 16px;
            display: block;
            color: var(--demo-green);
        }
        .bento-item h3 {
            font-family: var(--font-head);
            font-size: clamp(1.2rem, 1.8vw, 1.6rem);
            color: #fff;
            margin: 0 0 10px;
            letter-spacing: -0.5px;
        }
        .bento-item p {
            color: var(--text-muted);
            font-size: 0.92rem;
            line-height: 1.7;
        }
        .bento-item ul {
            list-style: none;
            padding: 0;
            margin: 16px 0 0;
        }
        .bento-item ul li {
            display: flex;
            gap: 14px;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            font-size: 0.88rem;
            color: #d1d5db;
        }
        .bento-item ul li:last-child {
            border-bottom: none;
        }
        .bento-item ul li i {
            flex-shrink: 0;
            margin-top: 3px;
            font-size: 0.75rem;
            color: var(--demo-green);
        }
        .bento-item .tag-badge {
            display: inline-block;
            font-family: var(--font-mono);
            font-size: 0.5rem;
            letter-spacing: 1.4px;
            padding: 4px 14px;
            border-radius: 30px;
            background: rgba(57, 255, 20, 0.05);
            border: 1px solid rgba(57, 255, 20, 0.10);
            color: var(--demo-green);
            margin-top: 12px;
        }

        .bento-span-8 {
            grid-column: span 8;
        }
        .bento-span-6 {
            grid-column: span 6;
        }
        .bento-span-4 {
            grid-column: span 4;
        }
        @media (max-width: 1100px) {
            .bento-span-8,
            .bento-span-6,
            .bento-span-4 {
                grid-column: span 12;
            }
        }

        /* ============================================================
           ZIPLOC PROTOCOL — TIMELINE
           ============================================================ */
        .demo-timeline {
            display: flex;
            flex-direction: column;
            gap: 30px;
            max-width: 900px;
            margin: 0 auto;
            position: relative;
        }
        .demo-timeline::before {
            content: '';
            position: absolute;
            left: 18px;
            top: 20px;
            bottom: 20px;
            width: 2px;
            background: linear-gradient(to bottom, var(--demo-green), var(--demo-cyan));
            opacity: 0.2;
        }
        .demo-step {
            display: flex;
            gap: 30px;
            align-items: flex-start;
            padding-left: 10px;
        }
        .demo-step-marker {
            flex-shrink: 0;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(57, 255, 20, 0.06);
            border: 2px solid rgba(57, 255, 20, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-mono);
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--demo-green);
            position: relative;
            z-index: 2;
            background: var(--bg-primary);
        }
        .demo-step-content {
            flex: 1;
            padding: 20px 24px;
            border-radius: var(--radius-md);
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            transition: all 0.3s;
        }
        .demo-step-content:hover {
            border-color: rgba(57, 255, 20, 0.08);
        }
        .demo-step-content h3 {
            font-family: var(--font-head);
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: #fff;
        }
        .demo-step-content p {
            color: var(--text-muted);
            font-size: 0.92rem;
            line-height: 1.7;
            margin: 0;
        }
        @media (max-width: 600px) {
            .demo-step {
                gap: 16px;
                padding-left: 0;
            }
            .demo-step-marker {
                width: 32px;
                height: 32px;
                font-size: 0.6rem;
            }
            .demo-step-content {
                padding: 16px 18px;
            }
        }

        /* ============================================================
           SCANNER CARDS (Wandmontage)
           ============================================================ */
        .scanner-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
        }
        @media (max-width: 900px) {
            .scanner-grid {
                grid-template-columns: 1fr;
                max-width: 500px;
                margin: 0 auto;
            }
        }
        .scanner-card {
            padding: 32px 28px;
            border-radius: var(--radius-md);
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            transition: all 0.4s var(--transition-bounce);
            position: relative;
            overflow: hidden;
        }
        .scanner-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--demo-green), var(--demo-cyan));
            opacity: 0;
            transition: opacity 0.4s;
        }
        .scanner-card:hover::before {
            opacity: 1;
        }
        .scanner-card:hover {
            transform: translateY(-6px);
            border-color: rgba(57, 255, 20, 0.08);
            box-shadow: var(--shadow-glow);
        }
        .scanner-card .scanner-icon {
            font-size: 2.2rem;
            margin-bottom: 16px;
            display: block;
        }
        .scanner-card h3 {
            font-family: var(--font-head);
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: #fff;
        }
        .scanner-card p {
            color: var(--text-muted);
            font-size: 0.88rem;
            line-height: 1.6;
            margin-bottom: 16px;
        }
        .scanner-card .scanner-badge {
            display: inline-block;
            font-family: var(--font-mono);
            font-size: 0.5rem;
            letter-spacing: 1.2px;
            padding: 4px 14px;
            border-radius: 100px;
            background: rgba(57, 255, 20, 0.04);
            border: 1px solid rgba(57, 255, 20, 0.08);
            color: var(--demo-green);
        }
        .scanner-card.cyan-card .scanner-icon {
            color: var(--demo-cyan);
        }
        .scanner-card.cyan-card .scanner-badge {
            color: var(--demo-cyan);
            border-color: rgba(0, 229, 255, 0.10);
            background: rgba(0, 229, 255, 0.04);
        }
        .scanner-card.gold-card .scanner-icon {
            color: var(--neon-gold);
        }
        .scanner-card.gold-card .scanner-badge {
            color: var(--neon-gold);
            border-color: rgba(255, 215, 0, 0.08);
            background: rgba(255, 215, 0, 0.03);
        }

        /* ============================================================
           VALUE PROPOSITION
           ============================================================ */
        .value-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: start;
        }
        @media (max-width: 900px) {
            .value-grid {
                grid-template-columns: 1fr;
                gap: 30px;
            }
        }
        .value-item {
            display: flex;
            gap: 18px;
            padding: 24px;
            border-radius: var(--radius-md);
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            transition: all 0.3s;
        }
        .value-item:hover {
            border-color: rgba(57, 255, 20, 0.06);
            transform: translateX(4px);
        }
        .value-item .value-icon {
            flex-shrink: 0;
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: rgba(57, 255, 20, 0.04);
            border: 1px solid rgba(57, 255, 20, 0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: var(--demo-green);
        }
        .value-item .value-icon.cyan-icon {
            color: var(--demo-cyan);
            border-color: rgba(0, 229, 255, 0.06);
            background: rgba(0, 229, 255, 0.03);
        }
        .value-item .value-icon.gold-icon {
            color: var(--neon-gold);
            border-color: rgba(255, 215, 0, 0.06);
            background: rgba(255, 215, 0, 0.03);
        }
        .value-item h4 {
            font-family: var(--font-head);
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 4px;
            color: #fff;
        }
        .value-item p {
            color: var(--text-muted);
            font-size: 0.88rem;
            line-height: 1.6;
            margin: 0;
        }

        /* ============================================================
           BEFORE / AFTER SLIDER
           ============================================================ */
        .ba-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: center;
        }
        @media (max-width: 900px) {
            .ba-wrapper {
                grid-template-columns: 1fr;
            }
        }
        .ba-info .ba-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin: 20px 0;
        }
        .ba-info .ba-stats .ba-stat {
            padding: 16px;
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-subtle);
            text-align: center;
        }
        .ba-info .ba-stats .ba-stat .num {
            font-family: var(--font-head);
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--demo-green);
        }
        .ba-info .ba-stats .ba-stat .lbl {
            font-family: var(--font-mono);
            font-size: 0.5rem;
            color: var(--text-dim);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .ba-slider-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16/10;
            border-radius: var(--radius-md);
            overflow: hidden;
            border: 1px solid var(--border-subtle);
            background: #000;
            cursor: ew-resize;
            user-select: none;
        }
        .ba-slider-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            pointer-events: none;
        }
        .ba-slider-container .ba-after {
            clip-path: inset(0 50% 0 0);
            transition: clip-path 0.05s;
        }
        .ba-slider-container .ba-handle {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 3px;
            background: var(--demo-green);
            transform: translateX(-50%);
            z-index: 5;
            box-shadow: 0 0 20px rgba(57, 255, 20, 0.25);
            cursor: ew-resize;
            pointer-events: none;
        }
        .ba-slider-container .ba-handle::after {
            content: '⟷';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--demo-green);
            color: #000;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-family: var(--font-mono);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
            font-weight: 700;
        }
        .ba-labels {
            position: absolute;
            bottom: 16px;
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: space-between;
            z-index: 4;
            pointer-events: none;
        }
        .ba-labels span {
            font-family: var(--font-mono);
            font-size: 0.55rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 4px 14px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: var(--text-muted);
        }
        .ba-labels .ba-before-label {
            color: #ff6b6b;
        }
        .ba-labels .ba-after-label {
            color: var(--demo-green);
        }

        /* ============================================================
           TESTIMONIALS
           ============================================================ */
        .reviews-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
        }
        @media (max-width: 900px) {
            .reviews-grid {
                grid-template-columns: 1fr;
                max-width: 500px;
                margin: 0 auto;
            }
        }
        .review-card {
            padding: 28px 24px;
            border-radius: var(--radius-md);
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            transition: all 0.4s var(--transition-bounce);
        }
        .review-card:hover {
            transform: translateY(-6px);
            border-color: rgba(57, 255, 20, 0.08);
            box-shadow: var(--shadow-glow);
        }
        .review-card .stars {
            color: var(--neon-gold);
            letter-spacing: 2px;
            margin-bottom: 10px;
            font-size: 0.85rem;
        }
        .review-card .review-tag {
            font-family: var(--font-mono);
            font-size: 0.45rem;
            letter-spacing: 1.5px;
            color: var(--demo-cyan);
            background: var(--demo-cyan-dim);
            padding: 2px 12px;
            border-radius: 100px;
            display: inline-block;
            margin-bottom: 10px;
        }
        .review-card blockquote {
            font-size: 0.88rem;
            color: var(--text-primary);
            line-height: 1.6;
            margin-bottom: 16px;
            font-style: italic;
        }
        .review-card .client {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
        }
        .review-card .client .name {
            font-weight: 600;
            font-size: 0.85rem;
            color: #fff;
        }
        .review-card .client .location {
            font-size: 0.6rem;
            color: var(--text-dim);
            margin-left: 6px;
        }
        .review-card .client .platform {
            font-family: var(--font-mono);
            font-size: 0.4rem;
            letter-spacing: 1px;
            padding: 3px 12px;
            border-radius: 100px;
            background: rgba(57, 255, 20, 0.04);
            color: var(--demo-green);
            border: 1px solid rgba(57, 255, 20, 0.06);
        }

        .trust-platforms {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }
        .platform-badge {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 28px;
            border: 1px solid rgba(57, 255, 20, 0.06);
            background: rgba(0, 0, 0, 0.35);
            border-radius: 10px;
            transition: 0.3s;
            cursor: pointer;
        }
        .platform-badge:hover {
            transform: translateY(-4px);
            border-color: var(--demo-green);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
        }
        .platform-badge .p-name {
            font-weight: 900;
            font-size: 1.1rem;
            color: #fff;
            letter-spacing: -0.5px;
        }
        .platform-badge .p-name span {
            color: var(--demo-green);
        }
        .platform-badge .p-divider {
            border-left: 1px solid rgba(255, 255, 255, 0.06);
            padding-left: 16px;
        }
        .platform-badge .p-rating {
            font-weight: 900;
            font-size: 1.4rem;
            color: #fff;
            line-height: 1;
        }
        .platform-badge .p-sub {
            font-family: var(--font-mono);
            font-size: 0.5rem;
            color: var(--demo-green);
            letter-spacing: 1px;
            margin-top: 2px;
        }

        /* ============================================================
           FAQ
           ============================================================ */
        .faq-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-width: 920px;
            margin: 0 auto;
        }
        .faq-item {
            border-radius: var(--radius-md);
            overflow: hidden;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: border-color 0.3s;
        }
        .faq-item.active {
            border-color: rgba(57, 255, 20, 0.10);
        }
        .faq-item .trigger {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px;
            width: 100%;
            text-align: left;
            background: transparent;
            cursor: pointer;
            gap: 16px;
        }
        .faq-item .trigger .left .cat {
            font-family: var(--font-mono);
            font-size: 0.45rem;
            letter-spacing: 2px;
            color: var(--demo-green);
            text-transform: uppercase;
        }
        .faq-item .trigger .left h4 {
            font-family: var(--font-head);
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            margin: 2px 0 0;
        }
        .faq-item .trigger .icon {
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.04);
            flex-shrink: 0;
            transition: 0.3s;
            font-size: 1.1rem;
            color: var(--text-muted);
        }
        .faq-item.active .trigger .icon {
            transform: rotate(45deg);
            color: var(--demo-green);
            border-color: rgba(57, 255, 20, 0.10);
        }
        .faq-item .answer {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s var(--ease-out-expo);
        }
        .faq-item.active .answer {
            max-height: 400px;
        }
        .faq-item .answer .inner {
            padding: 0 24px 24px 24px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 700px) {
            .faq-item .answer .inner {
                grid-template-columns: 1fr;
            }
        }
        .faq-item .answer .inner .block h6 {
            font-family: var(--font-mono);
            font-size: 0.55rem;
            color: var(--demo-green);
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
        .faq-item .answer .inner .block p {
            font-size: 0.78rem;

        /* ============================================================

            border-color: var(--demo-green);

        }
        .footer-col h5 {

            font-size: 0.6rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-dim);

        .footer-col a {
            display: block;
            color: var(--text-muted);
            font-size: 0.85rem;
            padding: 4px 0;
            transition: color 0.3s;
        }
        .footer-col a:hover {

        .footer-bottom {

            padding-top: 24px;
            display: flex;

            flex-wrap: wrap;

        /* ============================================================
           WHATSAPP FLOAT
           ============================================================ */
        .whatsapp-float {
            position: fixed;
            right: 20px;
            bottom: 24px;
            z-index: 9999;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #25d366;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            box-shadow: 0 8px 32px rgba(37, 211, 102, 0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-decoration: none;
        }
        .whatsapp-float:hover {
            transform: scale(1.1) translateY(-4px);
            box-shadow: 0 12px 44px rgba(37, 211, 102, 0.5);
        }
        .whatsapp-pulse {
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            border: 2px solid rgba(37, 211, 102, 0.25);
            animation: whatsappPulse 2s ease-in-out infinite;
        }
        @keyframes whatsappPulse {
            0%,
            100% {
                transform: scale(1);
                opacity: 0.5;
            }
            50% {
                transform: scale(1.25);
                opacity: 0;
            }
        }

        /* ============================================================
           REVEAL
           ============================================================ */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.7s var(--ease-out-expo);
        }
        .reveal.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* ============================================================
           REDUCED MOTION
           ============================================================ */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
            .demo-marquee-track {
                animation: none;
                flex-wrap: wrap;
                justify-content: center;
            }
            .whatsapp-pulse {
                animation: none;
            }
            .btn,
            .bento-item,
            .problem-card,
            .review-card,
            .faq-item,
            .platform-badge,
            .scanner-card {
                transition: none !important;
            }
            .bento-item:hover,
            .problem-card:hover,
            .review-card:hover,
            .platform-badge:hover,
            .scanner-card:hover {
                transform: none !important;
            }
            .reveal {
                opacity: 1 !important;
                transform: none !important;
            }
        }
