    <!-- Dynamic Base Tag -->
    <script>
        (function() {
            function getBasePath() {
                const parts = window.location.pathname.split('/').filter(p => p.length > 0);
                if (parts.length > 0 && parts[parts.length - 1].includes('.')) parts.pop();
                const depth = parts.length;
                return depth === 0 ? './' : '../'.repeat(depth);
            }
            const base = getBasePath();
            const baseEl = document.createElement('base');
            baseEl.href = base;
            document.head.insertBefore(baseEl, document.head.firstChild);
            window.__base = base;
        })();

            // ── Helper: inject component ──
            function loadComponent(selector, fallback) {
                const container = document.querySelector(selector);
                if (!container) {
                    console.warn('⚠️ Placeholder not found:', selector);
                    return;
                }
                // Always inject the fallback – guaranteed to work
                container.innerHTML = fallback;
                console.log('✅ Loaded:', selector);
            }

            // ── Initialize ──
            function init() {
                loadComponent('#nav-placeholder', NAV_FALLBACK);
                loadComponent('#footer-placeholder', FOOTER_FALLBACK);

                // Re‑bind all interactive elements after 50ms
                setTimeout(function() {
                    // Mobile menu
                    var navToggle = document.getElementById('navToggle');
                    var mobileMenu = document.getElementById('mobileMenu');
                    var navBackdrop = document.getElementById('navBackdrop');
                    var mobileClose = document.getElementById('mobileClose');
                    var body = document.body;

                    function openMenu() {
                        if (mobileMenu) mobileMenu.classList.add('open');
                        if (navBackdrop) navBackdrop.classList.add('active');
                        if (navToggle) navToggle.setAttribute('aria-expanded', 'true');
                        if (mobileMenu) mobileMenu.setAttribute('aria-hidden', 'false');
                        body.style.overflow = 'hidden';
                    }

                    function closeMenu() {
                        if (mobileMenu) mobileMenu.classList.remove('open');
                        if (navBackdrop) navBackdrop.classList.remove('active');
                        if (navToggle) navToggle.setAttribute('aria-expanded', 'false');
                        if (mobileMenu) mobileMenu.setAttribute('aria-hidden', 'true');
                        body.style.overflow = '';
                        if (navToggle) navToggle.focus();
                    }

                    if (navToggle && mobileMenu) {
                        navToggle.addEventListener('click', function(e) {
                            e.preventDefault();
                            if (mobileMenu.classList.contains('open')) {
                                closeMenu();
                            } else {
                                openMenu();
                            }
                        });
                    }

                    if (navBackdrop) navBackdrop.addEventListener('click', closeMenu);
                    if (mobileClose) mobileClose.addEventListener('click', closeMenu);

                    document.addEventListener('keydown', function(e) {
                        if (e.key === 'Escape' && mobileMenu && mobileMenu.classList.contains('open')) {
                            closeMenu();
                        }
                    });

                    if (mobileMenu) {
                        mobileMenu.querySelectorAll('a').forEach(function(link) {
                            link.addEventListener('click', closeMenu);
                        });
                    }

                    // Theme toggle
                    document.querySelectorAll('[data-theme-toggle]').forEach(function(btn) {
                        btn.addEventListener('click', function() {
                            var html = document.documentElement;
                            var current = html.getAttribute('data-theme') || 'dark';
                            var next = current === 'dark' ? 'light' : 'dark';
                            html.setAttribute('data-theme', next);
                            localStorage.setItem('rl-theme', next);
                            document.querySelectorAll('[data-theme-icon]').forEach(function(i) {
                                i.className = next === 'dark' ? 'fas fa-moon' : 'fas fa-sun';
                            });
                            var meta = document.getElementById('themeColorMeta');
                            if (meta) meta.content = next === 'dark' ? '#0B0A09' : '#F9F7F2';
                        });
                    });

                    // Newsletter
                    var form = document.getElementById('newsletterForm');
                    if (form) {
                        form.addEventListener('submit', function(e) {
                            e.preventDefault();
                            var btn = this.querySelector('button');
                            var orig = btn.innerHTML;
                            btn.innerHTML = '<i class="fas fa-check"></i> Willkommen!';
                            btn.style.background = 'var(--rl-gradient-hover)';
                            setTimeout(function() {
                                btn.innerHTML = orig;
                                btn.style.background = '';
                                form.reset();
                            }, 2800);
                        });
                    }

                    // Language switcher
                    var langBtns = document.querySelectorAll('.lang-switcher button');
                    langBtns.forEach(function(btn) {
                        btn.addEventListener('click', function() {
                            var lang = this.getAttribute('data-lang');
                            if (!lang) return;
                            document.documentElement.setAttribute('data-lang', lang);
                            localStorage.setItem('rl-lang', lang);
                            langBtns.forEach(function(b) {
                                b.classList.toggle('active', b.getAttribute('data-lang') === lang);
                            });
                        });
                    });

                    // Dropdowns (mobile)
                    document.querySelectorAll('.nav-dropdown > a').forEach(function(trigger) {
                        trigger.addEventListener('click', function(e) {
                            if (window.innerWidth <= 900) {
                                e.preventDefault();
                                e.stopPropagation();
                                var parent = this.closest('.nav-dropdown');
                                var content = parent.querySelector('.nav-dropdown-content');
                                var isOpen = content.classList.contains('open');
                                document.querySelectorAll('.nav-dropdown-content.open').forEach(function(c) {
                                    if (c !== content) {
                                        c.classList.remove('open');
                                        c.closest('.nav-dropdown').querySelector('a').setAttribute('aria-expanded', 'false');
                                        c.closest('.nav-dropdown').querySelector('a').classList.remove('open');
                                    }
                                });
                                if (isOpen) {
                                    content.classList.remove('open');
                                    trigger.classList.remove('open');
                                    trigger.setAttribute('aria-expanded', 'false');
                                } else {
                                    content.classList.add('open');
                                    trigger.classList.add('open');
                                    trigger.setAttribute('aria-expanded', 'true');
                                }
                            }
                        });
                    });

                    // Nav auto‑hide
                    var nav = document.querySelector('.rl-nav');
                    var lastScroll = 0;
                    window.addEventListener('scroll', function() {
                        var currentScroll = window.pageYOffset || document.documentElement.scrollTop;
                        if (nav) nav.classList.toggle('scrolled', currentScroll > 20);
                        if (currentScroll > 80) {
                            if (currentScroll > lastScroll) {
                                if (nav) nav.classList.add('hidden');
                            } else {
                                if (nav) nav.classList.remove('hidden');
                            }
                        } else {
                            if (nav) nav.classList.remove('hidden');
                        }
                        lastScroll = currentScroll;
                    }, { passive: true });

                    // Active section (for nav links with data-section)
                    function updateActiveSection() {
                        var sections = document.querySelectorAll('section[id]');
                        var links = document.querySelectorAll('.nav-link[data-section]');
                        var current = '';
                        var scrollPos = window.scrollY + 120;
                        sections.forEach(function(s) {
                            var top = s.offsetTop,
                                h = s.offsetHeight;
                            if (scrollPos >= top && scrollPos < top + h) current = s.id;
                        });
                        links.forEach(function(l) {
                            l.classList.toggle('active', l.getAttribute('data-section') === current);
                        });
                    }
                    window.addEventListener('scroll', updateActiveSection, { passive: true });
                    updateActiveSection();

                    console.log('✅ Navigation & Footer initialized (about.html).');
                }, 50);
            }

            // ── Start ──
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>
