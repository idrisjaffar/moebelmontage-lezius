<!--
     USAGE:
     ======
     Include this file in any page where you need ratings.

     Basic usage (display only):
     <div id="rating-display"></div>
     <script src="components/rating.html"></script>

     Interactive usage (click to rate):
     <div id="rating-interactive"></div>
     <script>
         document.addEventListener('DOMContentLoaded', function() {
             FJRating.init({
                 container: 'rating-interactive',
                 mode: 'interactive',
                 initialRating: 4.5,
                 totalReviews: 124,
                 onRate: function(rating) {
                     console.log('User rated:', rating);
                 }
             });
         });
     </script>

     The component supports:
     - Display mode (show rating with stars and count)
     - Interactive mode (click stars to rate)
     - Rating distribution bars (like Meituan)
     - Recent reviews list
     - Average rating display
     - Dark mode support
     - Full accessibility (keyboard navigation, ARIA)
     - Responsive design
-->

<script>
    (function() {
        'use strict';

        // ── SAMPLE DATA ──
        const SAMPLE_REVIEWS = [{
            id: 1,
            name: 'Michael S.',
            avatar: '',
            initials: 'MS',
            rating: 5,
            text: 'Absolute Präzision! Raphael hat unsere USM Haller Module perfekt montiert. Jeder Handgriff saß, sauberer geht es nicht. Klare Empfehlung!',
            date: 'vor 3 Tagen',
            helpful: 24,
            verified: true,
            badge: 'verified',
        }, {
            id: 2,
            name: 'Anna K.',
            avatar: '',
            initials: 'AK',
            rating: 5,
            text: 'Sehr zuverlässig und termintreu. Die Küche wurde in Rekordzeit montiert und sieht fantastisch aus. Jederzeit wieder!',
            date: 'vor 2 Wochen',
            helpful: 12,
            verified: true,
            badge: 'verified',
        }, {
            id: 3,
            name: 'Dr. Weber',
            avatar: '',
            initials: 'DW',
            rating: 5,
            text: 'Professionell von A bis Z. Raphael hat unsere gesamte Kanzlei mit USM Haller ausgestattet. Perfekte Beratung und Ausführung.',
            date: 'vor 1 Monat',
            helpful: 8,
            verified: true,
            badge: 'verified',
        }, {
            id: 4,
            name: 'Familie Richter',
            avatar: '',
            initials: 'FR',
            rating: 4,
            text: 'Gute Arbeit, aber leichte Verzögerung bei der Lieferung. Die Montage selbst war einwandfrei.',
            date: 'vor 2 Monaten',
            helpful: 3,
            verified: false,
            badge: '',
        }];

        // Rating labels for interactive mode
        const RATING_LABELS = {
            1: 'Sehr schlecht',
            2: 'Schlecht',
            3: 'Durchschnitt',
            4: 'Gut',
            5: 'Ausgezeichnet'
        };

        const EMOJIS = {
            1: '😞',
            2: '😕',
            3: '😐',
            4: '😊',
            5: '🌟'
        };

        // ── DEFAULT CONFIG ──
        const DEFAULT_CONFIG = {
            container: 'fjRatingContainer',
            mode: 'display', // 'display' | 'interactive' | 'compact'
            initialRating: 4.9,
            totalReviews: 124,
            distribution: {
                5: 78,
                4: 32,
                3: 10,
                2: 3,
                1: 1,
            },
            reviews: SAMPLE_REVIEWS,
            onRate: null,
            readOnly: false,
            showDistribution: true,
            showReviews: true,
            maxReviews: 3,
            starSize: 'default', // 'default' | 'small' | 'large'
        };

        // ── STATE ──
        let config = {};
        let currentRating = 0;
        let hoverRating = 0;
        let isRated = false;

        // ── DOM REFS ──
        const container = document.getElementById(DEFAULT_CONFIG.container) || document.getElementById('fjRatingContainer');

        // ── HELPERS ──
        function renderStars(rating, maxStars = 5, emptyClass = 'empty') {
            const fullStars = Math.floor(rating);
            const hasHalf = rating % 1 >= 0.5;
            const emptyStars = maxStars - fullStars - (hasHalf ? 1 : 0);

            let html = '';
            for (let i = 0; i < fullStars; i++) {
                html += '<i class="fas fa-star"></i>';
            }
            if (hasHalf) {
                html += '<i class="fas fa-star-half-alt"></i>';
            }
            for (let i = 0; i < emptyStars; i++) {
                html += `<i class="fas fa-star ${emptyClass}"></i>`;
            }
            return html;
        }

        function getInitials(name) {
            return name.split(' ').map(word => word.charAt(0)).join('').toUpperCase().substring(0, 2);
        }

        function getBadgeHTML(badge) {
            const badges = {
                verified: '<span class="fj-rating-review-badge"><i class="fas fa-check-circle"></i> Verifiziert</span>',
                premium: '<span class="fj-rating-review-badge" style="background:rgba(245,158,11,0.08);color:var(--fj-amber);border-color:rgba(245,158,11,0.10);">⭐ Premium</span>',
            };
            return badges[badge] || '';
        }

        function getDistributionData(distribution, total) {
            const stars = [5, 4, 3, 2, 1];
            return stars.map(function(star) {
                const count = distribution[star] || 0;
                const percent = total > 0 ? (count / total) * 100 : 0;
                return { star, count, percent };
            });
        }

        function getStarLabel(rating) {
            return RATING_LABELS[rating] || '';
        }

        function getEmoji(rating) {
            return EMOJIS[rating] || '⭐';
        }

        // ── RENDER ──
        function render() {
            if (!container) return;

            const mode = config.mode || 'display';
            const isInteractive = mode === 'interactive';
            const isCompact = mode === 'compact';
            const rating = config.initialRating || 0;
            const total = config.totalReviews || 0;
            const distribution = config.distribution || { 5: 0, 4: 0, 3: 0, 2: 0, 1: 0 };
            const reviews = config.reviews || [];
            const maxReviews = config.maxReviews || 3;
            const showDistribution = config.showDistribution !== false;
            const showReviews = config.showReviews !== false;
            const readOnly = config.readOnly || false;

            currentRating = rating;
            isRated = rating > 0;

            // Build HTML
            let html = '';

            // ── TOP SECTION ──
            html += `<div class="fj-rating-top">`;

            // Average Score
            html += `
                <div class="fj-rating-average">
                    <span class="fj-rating-number">
                        ${rating.toFixed(1)}
                        <span class="fj-rating-decimal">/ 5.0</span>
                    </span>
                    <span class="fj-rating-stars-display">
                        ${renderStars(rating)}
                    </span>
                    <span class="fj-rating-total">
                        <strong>${total}</strong> Bewertungen
                    </span>
                </div>
            `;

            // Stars (interactive or display)
            if (isInteractive && !readOnly) {
                html += `
                    <div class="fj-rating-stars-interactive" role="radiogroup" aria-label="Bewertung abgeben">
                        ${[5,4,3,2,1].map(function(star) {
                            const active = star <= Math.round(currentRating) ? 'active' : '';
                            const label = getStarLabel(star);
                            const emoji = getEmoji(star);
                            return `
                                <span class="fj-star ${active}" data-value="${star}" role="radio" aria-checked="${star <= Math.round(currentRating)}" tabindex="0" aria-label="${label} (${star} von 5 Sternen)">
                                    <i class="fas fa-star"></i>
                                    <span class="fj-star-label">${emoji} ${label}</span>
                                </span>
                            `;
                        }).reverse().join('')}
                    </div>
                `;

                // Feedback message
                const currentRatingRounded = Math.round(currentRating);
                if (currentRatingRounded > 0) {
                    html += `
                        <div class="fj-rating-feedback">
                            <span class="fj-rating-feedback-emoji">${getEmoji(currentRatingRounded)}</span>
                            <span class="fj-rating-feedback-text">${getStarLabel(currentRatingRounded)}</span>
                            ${currentRatingRounded >= 4 ? ' – Vielen Dank für Ihre Bewertung! 🙏' : ''}
                        </div>
                    `;
                } else {
                    html += `
                        <div class="fj-rating-feedback">
                            <span class="fj-rating-feedback-text">👆 Klicken Sie auf die Sterne, um zu bewerten</span>
                        </div>
                    `;
                }
            } else {
                // Display-only stars
                html += `
                    <div class="fj-rating-stars-display" style="font-size:1.2rem;gap:4px;margin-top:4px;">
                        ${renderStars(rating)}
                        <span style="font-size:0.8rem;color:var(--fj-muted);margin-left:8px;font-weight:500;">
                            ${rating.toFixed(1)} von 5.0
                        </span>
                    </div>
                `;
            }

            html += `</div>`; // end fj-rating-top

            // ── DISTRIBUTION ──
            if (showDistribution && !isCompact) {
                const distData = getDistributionData(distribution, total);
                const maxPercent = Math.max(...distData.map(d => d.percent), 1);

                html += `
                    <div class="fj-rating-distribution">
                        <div class="fj-rating-dist-title">
                            <i class="fas fa-chart-bar" style="color:var(--fj-teal);"></i> Bewertungsverteilung
                            <span class="fj-rating-dist-badge">${total} Stimmen</span>
                        </div>
                        ${distData.map(function(item) {
                            const percent = maxPercent > 0 ? (item.percent / maxPercent) * 100 : 0;
                            return `
                                <div class="fj-rating-stat-row">
                                    <span class="fj-rating-stat-label">${item.star}★</span>
                                    <span class="fj-rating-stat-bar">
                                        <span class="fj-rating-stat-fill" style="width:${percent}%;--fill-width:${percent}%;"></span>
                                    </span>
                                    <span class="fj-rating-stat-percent">${item.count}</span>
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;
            }

            // ── REVIEWS ──
            if (showReviews && !isCompact && reviews.length > 0) {
                const displayReviews = reviews.slice(0, maxReviews);

                html += `
                    <div class="fj-rating-reviews">
                        <div class="fj-rating-reviews-title">
                            <span>
                                <i class="fas fa-comment" style="color:var(--fj-teal);"></i> Neueste Bewertungen
                                <span class="fj-rating-reviews-count">(${reviews.length} insgesamt)</span>
                            </span>
                            <button class="fj-rating-reviews-link" onclick="FJRating.showAllReviews()">
                                Alle anzeigen <i class="fas fa-arrow-right"></i>
                            </button>
                        </div>
                        ${displayReviews.map(function(review) {
                            const initials = review.initials || getInitials(review.name);
                            const badgeHTML = getBadgeHTML(review.badge);
                            const starsHTML = renderStars(review.rating);

                            return `
                                <div class="fj-rating-review-item">
                                    <div class="fj-rating-review-avatar">
                                        ${review.avatar ? `<img src="${review.avatar}" alt="${review.name}" />` : initials}
                                    </div>
                                    <div class="fj-rating-review-content">
                                        <div class="fj-rating-review-name">
                                            ${review.name}
                                            ${badgeHTML}
                                        </div>
                                        <div class="fj-rating-review-stars">
                                            ${starsHTML}
                                        </div>
                                        <div class="fj-rating-review-text">${review.text}</div>
                                        <div class="fj-rating-review-meta">
                                            <span class="fj-rating-review-date"><i class="far fa-calendar-alt"></i> ${review.date}</span>
                                            <button class="fj-rating-review-helpful" data-review-id="${review.id}">
                                                <i class="far fa-thumbs-up"></i>
                                                <span>${review.helpful || 0}</span>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;
            }

            // ── EMPTY STATE ──
            if (showReviews && !isCompact && reviews.length === 0) {
                html += `
                    <div class="fj-rating-empty">
                        <i class="fas fa-star"></i>
                        <p>Noch keine Bewertungen vorhanden.<br />Seien Sie der Erste, der bewertet!</p>
                    </div>
                `;
            }

            // ── APPLY ──
            container.innerHTML = html;

            // ── APPLY COMPACT CLASS ──
            if (isCompact) {
                container.classList.add('fj-rating-compact');
            } else {
                container.classList.remove('fj-rating-compact');
            }

            // ── SETUP INTERACTIVE STARS ──
            if (isInteractive && !readOnly) {
                setupInteractiveStars();
            }

            // ── SETUP HELPFUL BUTTONS ──
            setupHelpfulButtons();

            // ── ANIMATE DISTRIBUTION BARS ──
            animateBars();

            console.log('✅ FIXJORI Rating component rendered.');
        }

        // ── INTERACTIVE STARS ──
        function setupInteractiveStars() {
            const stars = container.querySelectorAll('.fj-rating-stars-interactive .fj-star');

            stars.forEach(function(star) {
                const value = parseInt(star.dataset.value);

                // Click
                star.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const rating = parseInt(this.dataset.value);
                    handleRate(rating);
                });

                // Hover
                star.addEventListener('mouseenter', function() {
                    const rating = parseInt(this.dataset.value);
                    hoverRating = rating;
                    updateStarStates(rating);
                    updateFeedback(rating);
                });

                star.addEventListener('mouseleave', function() {
                    hoverRating = 0;
                    updateStarStates(currentRating);
                    if (currentRating > 0) {
                        updateFeedback(currentRating);
                    } else {
                        updateFeedback(0);
                    }
                });

                // Keyboard
                star.addEventListener('keydown', function(e) {
                    const current = parseInt(this.dataset.value);
                    let newValue = current;

                    switch (e.key) {
                        case 'ArrowRight':
                        case 'ArrowDown':
                            e.preventDefault();
                            newValue = Math.min(current + 1, 5);
                            break;
                        case 'ArrowLeft':
                        case 'ArrowUp':
                            e.preventDefault();
                            newValue = Math.max(current - 1, 1);
                            break;
                        case 'Enter':
                        case ' ':
                            e.preventDefault();
                            handleRate(current);
                            break;
                    }

                    if (newValue !== current) {
                        const target = container.querySelector(`.fj-star[data-value="${newValue}"]`);
                        if (target) target.focus();
                    }
                });
            });
        }

        function updateStarStates(rating) {
            const stars = container.querySelectorAll('.fj-rating-stars-interactive .fj-star');
            const rounded = Math.round(rating);

            stars.forEach(function(star) {
                const value = parseInt(star.dataset.value);
                const isActive = value <= rounded;
                star.classList.toggle('active', isActive);
                star.classList.toggle('hover', value <= hoverRating && hoverRating > 0);
                star.setAttribute('aria-checked', isActive ? 'true' : 'false');
            });
        }

        function updateFeedback(rating) {
            const feedback = container.querySelector('.fj-rating-feedback');
            if (!feedback) return;

            const rounded = Math.round(rating);
            if (rounded > 0 && rating > 0) {
                feedback.innerHTML = `
                    <span class="fj-rating-feedback-emoji">${getEmoji(rounded)}</span>
                    <span class="fj-rating-feedback-text">${getStarLabel(rounded)}</span>
                    ${rounded >= 4 ? ' – Vielen Dank für Ihre Bewertung! 🙏' : ''}
                `;
            } else if (rating === 0) {
                feedback.innerHTML = `
                    <span class="fj-rating-feedback-text">👆 Klicken Sie auf die Sterne, um zu bewerten</span>
                `;
            }
        }

        function handleRate(rating) {
            const rounded = Math.round(rating);
            currentRating = rounded;
            isRated = true;

            updateStarStates(rounded);
            updateFeedback(rounded);

            if (config.onRate && typeof config.onRate === 'function') {
                config.onRate(rounded);
            }

            // Dispatch custom event
            container.dispatchEvent(new CustomEvent('fj-rating', {
                detail: { rating: rounded }
            }));
        }

        // ── HELPFUL BUTTONS ──
        function setupHelpfulButtons() {
            container.querySelectorAll('.fj-rating-review-helpful').forEach(function(btn) {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const isLiked = this.classList.contains('liked');
                    const span = this.querySelector('span');
                    let count = parseInt(span.textContent) || 0;

                    if (isLiked) {
                        count = Math.max(count - 1, 0);
                        this.classList.remove('liked');
                        this.querySelector('i').className = 'far fa-thumbs-up';
                    } else {
                        count += 1;
                        this.classList.add('liked');
                        this.querySelector('i').className = 'fas fa-thumbs-up';
                    }

                    span.textContent = count;

                    // Update data
                    const id = this.dataset.reviewId;
                    const review = config.reviews.find(function(r) { return r.id == id; });
                    if (review) {
                        review.helpful = count;
                    }
                });
            });
        }

        // ── ANIMATE BARS ──
        function animateBars() {
            const bars = container.querySelectorAll('.fj-rating-stat-fill');
            bars.forEach(function(bar, index) {
                setTimeout(function() {
                    bar.classList.add('animate');
                }, 100 + (index * 80));
            });
        }

        // ── PUBLIC API ──
        window.FJRating = {
            // Initialize the component
            init: function(options) {
                config = { ...DEFAULT_CONFIG, ...options };
                // If container is a string ID, get element
                if (typeof config.container === 'string') {
                    const el = document.getElementById(config.container);
                    if (el) {
                        config.container = el;
                    }
                }
                // If container is an element, use it
                if (config.container && typeof config.container === 'object' && config.container.nodeType) {
                    // Container is set
                }
                render();
                return this;
            },

            // Update rating
            setRating: function(rating) {
                if (config.mode === 'interactive') {
                    handleRate(rating);
                } else {
                    currentRating = rating;
                    config.initialRating = rating;
                    render();
                }
                return this;
            },

            // Get current rating
            getRating: function() {
                return currentRating;
            },

            // Update reviews
            setReviews: function(reviews) {
                config.reviews = reviews;
                render();
                return this;
            },

            // Show all reviews (navigate)
            showAllReviews: function() {
                // In a real app, this would navigate to a reviews page
                alert('📋 Alle Bewertungen anzeigen (Navigiere zur Bewertungsseite)');
                // window.location.href = 'reviews.html';
            },

            // Refresh component
            refresh: function() {
                render();
                return this;
            },

            // Get configuration
            getConfig: function() {
                return config;
            },

            // Add a new review
            addReview: function(review) {
                if (config.reviews) {
                    config.reviews.unshift(review);
                    render();
                }
                return this;
            },

            // Update distribution
            setDistribution: function(distribution, total) {
                config.distribution = distribution;
                if (total) config.totalReviews = total;
                render();
                return this;
            },

            // Set total reviews count
            setTotalReviews: function(total) {
                config.totalReviews = total;
                render();
                return this;
            }
        };

        // ── AUTO-INIT (if container exists) ──
        function autoInit() {
            const containerEl = document.getElementById('fjRatingContainer');
            if (containerEl && !window._fjRatingInitialized) {
                window._fjRatingInitialized = true;
                FJRating.init({
                    container: containerEl,
                    mode: 'display',
                    initialRating: 4.9,
                    totalReviews: 124,
                    distribution: {
                        5: 78,
                        4: 32,
                        3: 10,
                        2: 3,
                        1: 1,
                    },
                    reviews: SAMPLE_REVIEWS,
                    showDistribution: true,
                    showReviews: true,
                    maxReviews: 3,
                });
                console.log('✅ FIXJORI Rating component auto-initialized.');
            }
        }

        // Auto-init when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', autoInit);
        } else {
            autoInit();
        }

        // Also expose for manual use
        console.log('✅ FIXJORI Star Rating component loaded.');
        console.log('📊 Usage: FJRating.init({ container: \'my-container\', mode: \'interactive\', ... })');

    })();
</script>
