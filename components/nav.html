<script>
    (function() {
        'use strict';

        // ── 1. MOBILE MENU ──
        const toggleBtn = document.getElementById('mobileToggle');
        const closeBtn = document.getElementById('mobileClose');
        const mobileMenu = document.getElementById('mobileMenu');
        const body = document.body;

        function openMenu() {
            mobileMenu.classList.add('is-open');
            toggleBtn.classList.add('is-active');
            toggleBtn.setAttribute('aria-expanded', 'true');
            body.style.overflow = 'hidden';
        }

        function closeMenu() {
            mobileMenu.classList.remove('is-open');
            toggleBtn.classList.remove('is-active');
            toggleBtn.setAttribute('aria-expanded', 'false');
            body.style.overflow = '';
        }

        if (toggleBtn) {
            toggleBtn.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                mobileMenu.classList.contains('is-open') ? closeMenu() : openMenu();
            });
        }
        if (closeBtn) {
            closeBtn.addEventListener('click', closeMenu);
        }

        // Close menu on link click
        mobileMenu.querySelectorAll('a').forEach(function(link) {
            link.addEventListener('click', closeMenu);
        });

        // Close on backdrop click
        mobileMenu.addEventListener('click', function(e) {
            if (e.target === mobileMenu) closeMenu();
        });

        // ESC key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeMenu();
        });

        // ── 2. THEME TOGGLE ──
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const html = document.documentElement;

        // Get stored theme or system preference
        const storedTheme = localStorage.getItem('fixjori-theme');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        let currentTheme = storedTheme || (systemPrefersDark ? 'dark' : 'light');

        function applyTheme(theme) {
            html.setAttribute('data-theme', theme);
            localStorage.setItem('fixjori-theme', theme);
            themeIcon.className = theme === 'dark' ? 'fas fa-moon' : 'fas fa-sun';
        }
        applyTheme(currentTheme);

        themeToggle.addEventListener('click', function() {
            currentTheme = currentTheme === 'light' ? 'dark' : 'light';
            applyTheme(currentTheme);
        });

        // ── 3. LOCATION DROPDOWN ──
        const locationBtn = document.getElementById('locationToggle');
        const locationMenu = document.getElementById('locationMenu');

        if (locationBtn && locationMenu) {
            locationBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                const isOpen = locationMenu.classList.contains('is-open');
                locationMenu.classList.toggle('is-open');
                locationBtn.setAttribute('aria-expanded', !isOpen);
            });

            // Close when clicking outside
            document.addEventListener('click', function(e) {
                if (!locationBtn.contains(e.target) && !locationMenu.contains(e.target)) {
                    locationMenu.classList.remove('is-open');
                    locationBtn.setAttribute('aria-expanded', 'false');
                }
            });

            // Select location
            locationMenu.querySelectorAll('a').forEach(function(item) {
                item.addEventListener('click', function(e) {
                    e.preventDefault();
                    const location = this.dataset.location;
                    const name = this.textContent;
                    locationBtn.innerHTML =
                        `<i class="fas fa-map-marker-alt"></i><span>${name}</span><i class="fas fa-chevron-down"></i>`;
                    locationMenu.classList.remove('is-open');
                    locationBtn.setAttribute('aria-expanded', 'false');
                });
            });
        }

        // ── 4. STICKY NAV ──
        const nav = document.getElementById('mainNav');
        let lastScrollY = 0;

        window.addEventListener('scroll', function() {
            const currentScrollY = window.scrollY;

            if (currentScrollY > 20) {
                nav.classList.add('is-scrolled');
            } else {
                nav.classList.remove('is-scrolled');
            }

            // Hide nav on scroll down, show on scroll up (clean UX)
            if (currentScrollY > 120) {
                if (currentScrollY > lastScrollY) {
                    nav.style.transform = 'translateY(-120%)';
                } else {
                    nav.style.transform = 'translateY(0)';
                }
            } else {
                nav.style.transform = 'translateY(0)';
            }

            lastScrollY = currentScrollY;
        }, { passive: true });

        // ── 5. QR TOGGLE (Demo) ──
        const qrBtn = document.getElementById('qrToggle');
        if (qrBtn) {
            qrBtn.addEventListener('click', function() {
                alert('📱 QR-Code Scanner würde hier geöffnet werden.\n(Simuliert)');
            });
        }

        console.log('✅ FIXJORI Navigation v3.0 loaded successfully.');
    })();
</script>
