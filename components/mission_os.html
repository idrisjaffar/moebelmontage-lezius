<div class="os-overlay" id="osOverlay">
    <div class="os-panel">
        <button class="os-close js-close-os">Schließen</button>
        <h2>Projekt <span>Uplink</span></h2>
        <p>Stellen Sie Ihre Anfrage – ich antworte innerhalb von 24 Stunden.</p>
        <form id="osForm" action="#" method="post">
            <div class="os-form-group">
                <label for="osName">Ihr Name</label>
                <input type="text" id="osName" placeholder="Max Mustermann" required />
            </div>
            <div class="os-form-group">
                <label for="osEmail">E-Mail</label>
                <input type="email" id="osEmail" placeholder="max@beispiel.de" required />
            </div>
            <div class="os-form-group">
                <label for="osMessage">Projektbeschreibung</label>
                <textarea id="osMessage" placeholder="Was möchten Sie montiert haben?" required></textarea>
            </div>
            <button type="submit" class="os-submit">Anfrage senden <i class="fas fa-paper-plane"></i></button>
        </form>
    </div>
</div>
