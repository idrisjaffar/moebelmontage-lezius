<!--
     USAGE:
     ======
     Include this file in any page where you need handyman/service cards.

     Basic usage:
     <div id="merchant-cards-container"></div>
     <script src="components/merchant-card.html"></script>

     Or directly embed the HTML and CSS/JS in your page.

     The component supports:
     - Grid and list layouts
     - Premium badge
     - Rating with star display
     - Skills/tags
     - Price display
     - Action buttons (Hire, View Profile, Book)
     - Availability status
     - Distance/location
     - Responsive design
     - Dark mode support
     - Click handlers
-->

            priceLabel: 'ab',
            priceUnit: '/ Projekt',
            location: 'Mannheim',
            distance: '4,1 km',
            available: true,
            status: 'online',
            premium: false,
            verified: false,
            new: true,
            badge: 'new',
            href: 'directory/profile.html?id=thomas',
            buttonText: 'Anfragen',
            buttonType: 'primary',
        }, {
            id: 6,
            name: 'Claudia Richter',
            title: 'Elektromeisterin · Smart Home Spezialistin',
            avatar: '',
            initials: 'CR',
            rating: 4.7,
            reviewCount: 32,
            skills: ['Elektro', 'Smart Home', 'Sicherheitstechnik'],
            price: 880,
            priceLabel: 'ab',
            priceUnit: '/ Projekt',
            location: 'Mannheim',
            distance: '1,8 km',
            available: true,
            status: 'online',
            premium: false,
            verified: true,
            new: false,
            badge: 'verified',
            href: 'directory/profile.html?id=claudia',
            buttonText: 'Anfragen',
            buttonType: 'primary',
        }];

        // ── DOM REFS ──
        const container = document.getElementById('fjMerchantContainer');

        // ── HELPERS ──
        function renderStars(rating) {
            const fullStars = Math.floor(rating);
            const hasHalf = rating % 1 >= 0.5;
            const emptyStars = 5 - fullStars - (hasHalf ? 1 : 0);

            let html = '';
            for (let i = 0; i < fullStars; i++) {
                html += '<i class="fas fa-star"></i>';
            }
            if (hasHalf) {
                html += '<i class="fas fa-star-half-alt"></i>';
            }
            for (let i = 0; i < emptyStars; i++) {
                html += '<i class="fas fa-star empty"></i>';
            }
            return html;
        }

        function getInitials(name) {
            return name.split(' ').map(word => word.charAt(0)).join('').toUpperCase().substring(0, 2);
        }

        function getStatusDot(status) {
            const classes = {
                online: '',
                busy: 'busy',
                offline: 'offline'
            };
            return classes[status] || '';
        }

        function getAvailabilityText(status) {
            const texts = {
                online: '🟢 Verfügbar',
                busy: '🟡 Beschäftigt',
                offline: '⚪ Nicht verfügbar'
            };
            return texts[status] || texts.offline;
        }

        function getBadgeHTML(badge) {
            const badges = {
                premium: '<span class="fj-card-badge premium">⭐ Premium</span>',
                verified: '<span class="fj-card-badge verified"><i class="fas fa-check-circle"></i> Verifiziert</span>',
                available: '<span class="fj-card-badge available"><i class="fas fa-circle"></i> Verfügbar</span>',
                new: '<span class="fj-card-badge new"><i class="fas fa-sparkles"></i> Neu</span>',
            };
            return badges[badge] || '';
        }

        function getButtonClass(type) {
            const classes = {
                primary: 'fj-card-btn-primary',
                secondary: 'fj-card-btn-secondary',
                amber: 'fj-card-btn-amber',
                outline: 'fj-card-btn-outline',
            };
            return classes[type] || classes.secondary;
        }

        // ── RENDER ──
        function renderCards(merchants, layout) {
            if (!container) return;

            // Set layout class
            container.className = layout === 'list' ? 'fj-merchant-card-list' : 'fj-merchant-card-grid';

            container.innerHTML = '';

            if (!merchants || merchants.length === 0) {
                container.innerHTML = `
                    <div style="text-align:center;padding:40px 20px;color:var(--fj-muted);grid-column:1/-1;">
                        <i class="fas fa-search" style="font-size:2rem;display:block;margin-bottom:12px;opacity:0.3;"></i>
                        <p style="font-size:1rem;font-weight:600;">Keine Handwerker gefunden</p>
                        <p style="font-size:0.85rem;margin-top:4px;">Versuchen Sie es mit anderen Suchkriterien.</p>
                    </div>
                `;
                return;
            }

            merchants.forEach(function(merchant) {
                const card = document.createElement('div');
                card.className = 'fj-merchant-card';
                if (merchant.premium) card.classList.add('fj-card-premium');
                card.setAttribute('role', 'listitem');
                card.setAttribute('data-id', merchant.id);

                const statusDot = getStatusDot(merchant.status);
                const availabilityText = getAvailabilityText(merchant.status);
                const badgeHTML = getBadgeHTML(merchant.badge);
                const buttonClass = getButtonClass(merchant.buttonType);
                const initials = merchant.initials || getInitials(merchant.name);

                // Avatar HTML
                let avatarHTML = '';
                if (merchant.avatar) {
                    avatarHTML = `<img src="${merchant.avatar}" alt="${merchant.name}" />`;
                } else {
                    avatarHTML = `<span class="fj-avatar-placeholder">${initials}</span>`;
                }

                card.innerHTML = `
                    <div class="fj-card-top">
                        <div class="fj-card-avatar">
                            ${avatarHTML}
                            <span class="fj-avatar-status ${statusDot}"></span>
                        </div>
                        <div class="fj-card-info">
                            <div class="fj-card-name-row">
                                <span class="fj-card-name">${merchant.name}</span>
                                ${badgeHTML}
                            </div>
                            <div class="fj-card-title">
                                ${merchant.title}
                                ${merchant.location ? `<span class="fj-card-location"><i class="fas fa-map-marker-alt"></i> ${merchant.location} ${merchant.distance ? '· ' + merchant.distance : ''}</span>` : ''}
                            </div>
                            <div class="fj-card-rating">
                                <span class="fj-stars">${renderStars(merchant.rating)}</span>
                                <span class="fj-rating-value">${merchant.rating.toFixed(1)}</span>
                                <span class="fj-rating-count">(${merchant.reviewCount})</span>
                            </div>
                            ${merchant.skills && merchant.skills.length ? `
                                <div class="fj-card-skills">
                                    ${merchant.skills.map(function(skill) {
                                        return `<span class="fj-card-skill">${skill}</span>`;
                                    }).join('')}
                                </div>
                            ` : ''}
                            <div class="fj-card-availability ${merchant.status === 'busy' ? 'busy' : merchant.status === 'offline' ? 'offline' : ''}">
                                <i class="fas fa-circle"></i> ${availabilityText}
                            </div>
                        </div>
                    </div>
                    <div class="fj-card-bottom">
                        <div class="fj-card-price">
                            <span class="fj-price-amount">
                                ${merchant.priceLabel ? merchant.priceLabel + ' ' : ''}
                                ${merchant.price ? '€ ' + merchant.price.toLocaleString('de-DE') : 'Auf Anfrage'}
                                <span class="fj-price-unit">${merchant.priceUnit || ''}</span>
                            </span>
                            <span class="fj-price-label">${merchant.priceLabel === 'ab' ? 'Mindestpreis' : 'Festpreis'}</span>
                        </div>
                        <div class="fj-card-actions">
                            <a href="${merchant.href || '#'}" class="fj-card-btn ${buttonClass}">
                                ${merchant.buttonIcon ? `<i class="${merchant.buttonIcon}"></i>` : ''}
                                ${merchant.buttonText || 'Anfragen'}
                            </a>
                            <button class="fj-card-btn fj-card-btn-secondary" data-action="favorite" data-id="${merchant.id}">
                                <i class="far fa-heart"></i>
                            </button>
                        </div>
                    </div>
                `;

                // Click handler for the whole card (except buttons)
                card.addEventListener('click', function(e) {
                    // Ignore if click is on a button or link
                    if (e.target.closest('.fj-card-btn') || e.target.closest('a')) return;
                    if (merchant.href) {
                        window.location.href = merchant.href;
                    }
                });

                // Favorite button handler
                const favBtn = card.querySelector('[data-action="favorite"]');
                if (favBtn) {
                    favBtn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const icon = this.querySelector('i');
                        if (icon.classList.contains('far')) {
                            icon.classList.remove('far');
                            icon.classList.add('fas');
                            this.style.color = 'var(--fj-red)';
                            this.style.borderColor = 'var(--fj-red)';
                            // Show toast notification
                            showToast('❤️ ' + merchant.name + ' zu Favoriten hinzugefügt');
                        } else {
                            icon.classList.remove('fas');
                            icon.classList.add('far');
                            this.style.color = '';
                            this.style.borderColor = '';
                            showToast('💔 ' + merchant.name + ' von Favoriten entfernt');
                        }
                    });
                }

                container.appendChild(card);
            });
        }

        // ── TOAST NOTIFICATION ──
        function showToast(message) {
            // Remove existing toast
            const existing = document.querySelector('.fj-toast-notification');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.className = 'fj-toast-notification';
            Object.assign(toast.style, {
                position: 'fixed',
                bottom: '24px',
                left: '50%',
                transform: 'translateX(-50%)',
                background: 'var(--fj-surface)',
                border: '1px solid var(--fj-border)',
                borderRadius: 'var(--fj-radius)',
                padding: '12px 24px',
                boxShadow: 'var(--fj-shadow-lg)',
                fontWeight: '600',
                fontSize: '0.85rem',
                color: 'var(--fj-text)',
                zIndex: '3000',
                display: 'flex',
                alignItems: 'center',
                gap: '12px',
                maxWidth: '90%',
                animation: 'fj-toast-slide-up 0.4s var(--ease-spring)',
                borderLeft: '4px solid var(--fj-teal)',
                fontFamily: 'var(--font-body)',
            });

            toast.innerHTML = `
                <span>${message}</span>
                <button style="background:none;border:none;font-size:1.1rem;color:var(--fj-dim);cursor:pointer;padding:0 4px;" onclick="this.parentElement.remove()">×</button>
            `;

            // Add keyframe if not exists
            if (!document.getElementById('fjToastStyles')) {
                const style = document.createElement('style');
                style.id = 'fjToastStyles';
                style.textContent = `
                    @keyframes fj-toast-slide-up {
                        0% { transform: translateX(-50%) translateY(20px); opacity: 0; }
                        100% { transform: translateX(-50%) translateY(0); opacity: 1; }
                    }
                    @keyframes fj-toast-fade-out {
                        0% { opacity: 1; transform: translateX(-50%) translateY(0); }
                        100% { opacity: 0; transform: translateX(-50%) translateY(10px); }
                    }
                `;
                document.head.appendChild(style);
            }

            document.body.appendChild(toast);

            // Auto-dismiss after 3.5s
            setTimeout(function() {
                if (toast.parentElement) {
                    toast.style.animation = 'fj-toast-fade-out 0.4s ease forwards';
                    setTimeout(function() {
                        if (toast.parentElement) toast.remove();
                    }, 400);
                }
            }, 3500);
        }

        // ── API ──
        window.FJMerchantCard = {
            render: function(merchants, layout) {
                const data = merchants || SAMPLE_MERCHANTS;
                renderCards(data, layout || 'grid');
            },
            getSampleData: function() {
                return SAMPLE_MERCHANTS;
            },
            // Filter merchants by criteria
            filter: function(merchants, filters) {
                return merchants.filter(function(m) {
                    let match = true;
                    if (filters.search) {
                        const search = filters.search.toLowerCase();
                        match = match && (m.name.toLowerCase().includes(search) ||
                            m.title.toLowerCase().includes(search) ||
                            m.skills.some(function(s) { return s.toLowerCase().includes(search); }));
                    }
                    if (filters.premium !== undefined) {
                        match = match && m.premium === filters.premium;
                    }
                    if (filters.available !== undefined) {
                        match = match && m.available === filters.available;
                    }
                    if (filters.minRating) {
                        match = match && m.rating >= filters.minRating;
                    }
                    if (filters.maxPrice) {
                        match = match && (m.price || 0) <= filters.maxPrice;
                    }
                    return match;
                });
            },
            // Sort merchants
            sort: function(merchants, sortBy) {
                const sorted = [...merchants];
                switch (sortBy) {
                    case 'rating':
                        sorted.sort(function(a, b) { return b.rating - a.rating; });
                        break;
                    case 'price-asc':
                        sorted.sort(function(a, b) { return (a.price || 0) - (b.price || 0); });
                        break;
                    case 'price-desc':
                        sorted.sort(function(a, b) { return (b.price || 0) - (a.price || 0); });
                        break;
                    case 'distance':
                        sorted.sort(function(a, b) {
                            const distA = parseFloat((a.distance || '99').replace(',', '.'));
                            const distB = parseFloat((b.distance || '99').replace(',', '.'));
                            return distA - distB;
                        });
                        break;
                    case 'name':
                        sorted.sort(function(a, b) { return a.name.localeCompare(b.name); });
                        break;
                    default:
                        break;
                }
                return sorted;
            }
        };

        // ── AUTO-INIT ──
        function init() {
            // Check if container exists
            if (!document.getElementById('fjMerchantContainer')) {
                // If container not found, create one
                const wrapper = document.createElement('div');
                wrapper.id = 'fjMerchantContainer';
                wrapper.className = 'fj-merchant-card-grid';
                // Find a parent or append to body
                const target = document.querySelector('.fj-kk-area')?.parentElement || document.body;
                target.appendChild(wrapper);
            }

            // Render with sample data
            renderCards(SAMPLE_MERCHANTS, 'grid');

            console.log('✅ FIXJORI Merchant Card component loaded.');
            console.log('📊 ' + SAMPLE_MERCHANTS.length + ' merchants rendered.');
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }

    })();
</script>
